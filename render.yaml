# Blueprint de Render para AlphaMind.
# El backend (Express) sirve el build del frontend desde 04_Fronted_web/dist,
# por eso se despliega como UN solo web service.
# En el dashboard de Render: New > Blueprint > selecciona este repo.

services:
  - type: web
    name: alphamind
    runtime: node
    plan: free
    # El repo debe tener esta carpeta como raíz (aquí vive este render.yaml).
    rootDir: .
    buildCommand: "cd 03_Backend && npm install && cd ../04_Fronted_web && npm install && npm run build"
    startCommand: "npm --prefix 03_Backend start"
    healthCheckPath: /api-docs/
    envVars:
      # Render inyecta PORT automáticamente: NO definir PORT aquí.
      - key: JWT_SECRET
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
